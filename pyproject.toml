[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyXSteam"
authors = [{ name = "drunsinn", email = "dr.unsinn@googlemail.com" }]
description = "pyXSteam is a port of the Matlab/Excel Package XSteam by Magnus Holmgren, www.x-eng.com to Python 3"
requires-python = ">=3.11"
keywords = ["steam", "water", "ice", "XSteam"]
dynamic = ["version"]
dependencies = []

[project.readme]
file = "README.md"
content-type = "text/markdown"

license-files = ["LICENSE.txt"]

[project.optional-dependencies]
demo = ["matplotlib>=3.9.4", "numpy>=2.4.6", "scipy>=1.9.3"]

[project.urls]
"Homepage" = "https://github.com/drunsinn/pyXSteam"
"Bug Tracker" = "https://github.com/drunsinn/pyXSteam/issues"

[project.scripts]
pyXSteamDemo = "pyXSteam.scripts.pyXSteamDemo:main"
pyXSteamRankineDemo = "pyXSteam.scripts.pyXSteamRankineDemo:main"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "codespell>=2.4.3",
    "myst-parser>=5.1.0",
    "numpy>=2.4.6",
    "pyclean>=3.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "sphinx>=9.0.4",
    "sphinx-autodoc-typehints>=3.6.1",
    "vermin>=1.9.2",
]

[tool.setuptools.packages.find]
include = ["pyXSteam*"]

[tool.setuptools.dynamic]
version = { attr = "pyXSteam.__version__" }

[tool.black]
line-length = 140
target-version = ["py311"]
include = "\\.pyi?$"
verbose = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
norecursedirs = ["docs", "build", "downloads"]
addopts = "--cov=pyXSteam --cov-branch --cov-report=term-missing:skip-covered --cov-report=html:dist/reports/coverage.html --cov-fail-under=70"

[tool.coverage.run]
omit = ["pyXSteam/scripts/*"]


[tool.codespell]
skip = "*.po,*.ts,./docs/build/*,./build/*,./dist/*,./.git,./.venv,*.pdf,*.m,./*.egg-info/*,./docs/*,./downloads/*"
count = ""
quiet-level = 3

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 140
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in `__init__.py` files.
"__init__.py" = ["F401"]
"pyXSteam/TransportProperties_HW.py" = ["F401"]
"pyXSteam/Regions.py" = ["E741"]
"pyXSteam/RegionBorders.py" = ["E741"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
